# Trigger patterns for accessibility-engineer skill activation.
# Consumed by core/trigger_router.py at Phase 4.
# Migrated from the v1 SKILL.md `triggers:` field as prompt_match rules.
#
# Lesson of #18: bare "frontend"/"ui" are dropped — "the dashboard UI is
# slow" is a performance complaint, not an accessibility question, and
# bare "frontend"/"ui" fired on almost any UI-adjacent prompt regardless
# of accessibility relevance. Keep the accessibility-specific vocabulary.

rules:
  - type: prompt_match
    pattern: '\b(accessibility|a11y|wcag|aria|screen\ readers?|keyboard)\b'
    note: migrated from v1 SKILL.md triggers field
